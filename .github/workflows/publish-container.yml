name: Publish container

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: Container version tag (for example v1.0.0)
        required: true
        default: v1.0.0

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF#refs/tags/}"
          else
            version="${{ inputs.version }}"
          fi
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "version must match vMAJOR.MINOR.PATCH" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=NOASSERTION

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Pull published image and run Streamlit smoke test
        shell: bash
        run: |
          image="${REGISTRY}/${IMAGE_NAME}:${{ steps.version.outputs.version }}"
          container="smarthouse-post-pull-smoke"

          # Ensure the smoke test can only use the image fetched from GHCR.
          docker image rm "$image" >/dev/null 2>&1 || true
          docker pull "$image"
          docker run --detach --name "$container" --publish 127.0.0.1:8502:8501 "$image"

          ready=false
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:8502/_stcore/health >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            docker logs "$container"
            exit 1
          fi

          curl --fail --silent --show-error http://127.0.0.1:8502/_stcore/health \
            | grep --fixed-strings 'ok'
          docker exec "$container" test -s /app/models/house_price_model.joblib

      - name: Clean up smoke-test container
        if: always()
        shell: bash
        run: docker rm --force smarthouse-post-pull-smoke >/dev/null 2>&1 || true
